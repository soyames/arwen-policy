name: Publish Arwen Policy Corpus

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Corpus release version, e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-arwen-policy-corpus
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Validate ETL configuration
        run: uv run arwen-etl validate-config

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release
        run: |
          if [ -f scripts/validate_release.py ]; then
            uv run python scripts/validate_release.py \
              --version "${{ steps.version.outputs.version }}"
          else
            echo "Release validator not present yet."
          fi

      - name: Build release manifest
        run: |
          if [ -f scripts/build_manifest.py ]; then
            uv run python scripts/build_manifest.py \
              --version "${{ steps.version.outputs.version }}"
          else
            echo "Manifest builder not present yet."
          fi

  publish:
    name: Publish to Hugging Face
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (with Hugging Face Hub)
        run: uv sync --extra hf

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare corpus release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR=".release/arwen-policy-corpus"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          copy_if_exists() {
            SOURCE="$1"
            TARGET="$2"

            if [ -e "$SOURCE" ]; then
              mkdir -p "$(dirname "$RELEASE_DIR/$TARGET")"
              cp -R "$SOURCE" "$RELEASE_DIR/$TARGET"
            fi
          }

          copy_if_exists "data" "data"

          # Ensure Hugging Face dataset split directories exist even if empty.
          # This preserves the expected layout (data/train, data/validation, data/test)
          # without inventing corpus records.
          mkdir -p "$RELEASE_DIR/data/train" "$RELEASE_DIR/data/validation" "$RELEASE_DIR/data/test"
          cat > "$RELEASE_DIR/data/README.md" <<'EOF'
          This release includes no train/validation/test JSONL files.
          The empty split directories are present to maintain a stable dataset layout
          expected by the dataset card and the Hugging Face dataset viewer.
          EOF
          touch "$RELEASE_DIR/data/train/.gitkeep" "$RELEASE_DIR/data/validation/.gitkeep" "$RELEASE_DIR/data/test/.gitkeep"

          copy_if_exists "benchmark" "benchmark"
          copy_if_exists "training" "training"
          copy_if_exists "schemas" "schemas"
          copy_if_exists "ontology" "ontology"
          copy_if_exists "docs" "docs"

          copy_if_exists "README.md" "README.md"
          copy_if_exists "LICENSE" "LICENSE"
          copy_if_exists "CITATION.cff" "CITATION.cff"

          cat > "$RELEASE_DIR/RELEASE_VERSION" <<EOF
          ${{ steps.version.outputs.version }}
          EOF

          cat > "$RELEASE_DIR/RELEASE_METADATA.json" <<EOF
          {
            "project": "Arwen Policy",
            "dataset": "soyames/arwen-policy-corpus",
            "version": "${{ steps.version.outputs.version }}",
            "git_repository": "https://github.com/soyames/arwen-policy",
            "git_commit": "${GITHUB_SHA}",
            "git_ref": "${GITHUB_REF}",
            "workflow": "${GITHUB_WORKFLOW}",
            "workflow_run_id": "${GITHUB_RUN_ID}"
          }
          EOF

      - name: Publish corpus
        env:
          HF_OIDC_RESOURCE: datasets/soyames/arwen-policy-corpus
        run: |
          hf upload \
            soyames/arwen-policy-corpus \
            .release/arwen-policy-corpus \
            . \
            --repo-type dataset \
            --commit-message \
            "Publish Arwen Policy Corpus v${{ steps.version.outputs.version }}"

      - name: Publish summary
        run: |
          echo "=============================================="
          echo "Arwen Policy Corpus published"
          echo "=============================================="
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Dataset: soyames/arwen-policy-corpus"
          echo "Commit: ${GITHUB_SHA}"
          echo "OIDC: enabled"
          echo "HF_TOKEN: NOT USED"
          echo "=============================================="