# Arwen Policy — QLoRA Training Configuration
# Qwen/Qwen3-8B with 4-bit NF4 quantization
# Target: Tesla T4 (15 GB VRAM) — verified to fit
# Also compatible with L40S/A100 for larger batch sizes

base_model: Qwen/Qwen3-8B
dataset: datasets/sft_final
output_dir: artifacts/qlora-arwen-8b

# ---- QLoRA (4-bit) ----
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
bnb_4bit_compute_dtype: float16  # T4 default; bfloat16 for Ampere+

# ---- LoRA ----
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_task_type: CAUSAL_LM

# Verified from Qwen3-8B architecture (Qwen3ForCausalLM, model_type qwen3):
#   36 layers, 4096 hidden, 32 attn heads, 8 KV heads
#   Standard self-attention (no Gated DeltaNet — simpler than Qwen3.6)
#   Linear modules: q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# ---- Training ----
learning_rate: 2.0e-4
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 3
warmup_ratio: 0.03
lr_scheduler_type: cosine
weight_decay: 0.01
max_seq_length: 2048

# ---- Memory ----
gradient_checkpointing: true
use_cache: false

# ---- Evaluation ----
evaluation_strategy: steps
eval_steps: 50
save_strategy: steps
save_steps: 100
save_total_limit: 3
logging_steps: 10

# ---- Reproducibility ----
seed: 42
dataloader_num_workers: 0
remove_unused_columns: false

# ---- Reporting ----
report_to: none

# ---- Dataset ----
# Uses datasets/sft_final/ with document-level split:
#   train.jsonl:      503 examples (153 source documents)
#   validation.jsonl:  60 examples ( 19 source documents)
#   test.jsonl:        64 examples ( 20 source documents)

# ---- ALTERNATIVE: Larger GPU (see configs/qwen3.6-27b-arwen-qlora.yaml) ----
# Qwen/Qwen3.6-27B requires ~18-24 GB VRAM even with 4-bit.
# Use A100/L40S/H100 for the 27B model.
