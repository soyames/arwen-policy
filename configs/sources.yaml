sources:
  - id: icann
    name: ICANN
    family: internet_governance
    domains:
      - icann.org
      - www.icann.org
    enabled: true
    discovery:
      seed_urls:
        - https://www.icann.org/
        - https://www.icann.org/resources
      sitemap_urls:
        - https://www.icann.org/sitemap.xml

  - id: igf
    name: Internet Governance Forum
    family: internet_governance
    domains:
      - intgovforum.org
      - www.intgovforum.org
    enabled: true
    discovery:
      seed_urls:
        - https://www.intgovforum.org/
        - https://www.intgovforum.org/en

  - id: ietf
    name: Internet Engineering Task Force
    family: technical_community
    domains:
      - ietf.org
      - www.ietf.org
