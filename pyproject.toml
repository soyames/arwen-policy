[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arwen-policy-etl"
version = "0.1.0"
description = "Reproducible provenance-preserving ETL pipeline for the Arwen Policy Corpus."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Yao Amevi Amessinou Sossou" }
]
keywords = [
  "internet-governance",
  "digital-policy",
  "ai-governance",
  "policy-analysis",
  "multistakeholder",
  "provenance",
  "etl",
  "corpus"
]
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6.0,<7",
  "pydantic>=2.8,<3",
  "jsonschema>=4.23,<5",
  "pytest>=8.4.2",
  "ollama>=0.6.2",
  "gradio>=6.22.0",
]

[project.optional-dependencies]
pdf = [
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<1"
]
docx = [
  "python-docx>=1.1,<2"
]
ocr = [
  "Pillow>=10,<13",
  "pytesseract>=0.3,<1"
]
audio = [
  "faster-whisper>=1,<2"
]
video = [
  "ffmpeg-python>=0.2,<1"
]
semantic = [
  "numpy>=1.26,<3",
  "sentence-transformers>=3,<6"
]
hf = [
  "huggingface-hub>=0.30,<2"
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1"
]

[project.scripts]
arwen-etl = "arwen_etl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arwen_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
